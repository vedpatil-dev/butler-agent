[project]
name = "local-agent"
version = "0.1.0"
description = "Local agentic coding assistant on Ollama + Qwen3.5-9B"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "httpx>=0.28",
    "mcp>=2.2",
    "prompt-toolkit>=3.0.53",
    "uvicorn>=0.53",
]

[dependency-groups]
dev = ["pytest>=9"]

[project.scripts]
agent = "agent.main:main"
butler = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a live Ollama with the model loaded (slow)"]
